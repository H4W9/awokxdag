name: Build & Release

# Manually triggered from the Actions tab. Set the release version there.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.1.4"
      prerelease:
        description: "Mark as pre-release?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: touch
            define: AWOK_DUAL_C5_TOUCH
            label: "Dual C5 Touch"
          - variant: mini
            define: AWOK_DUAL_C5_MINI
            label: "Dual C5 Mini"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Install libraries
        run: |
          arduino-cli lib install \
            "Adafruit GFX Library" \
            "Adafruit ILI9341" \
            "Adafruit ST7735 and ST7789 Library" \
            "Adafruit BusIO" \
            "NimBLE-Arduino" \
            "XPT2046_Touchscreen" \
            "TinyGPSPlus"

      - name: Compile ${{ matrix.label }} (produces the merged image)
        # -z muldefs lets our ieee80211_raw_frame_sanity_check override win over
        # the one in libnet80211.a (a stock core has this empty; enabling raw
        # deauth injection). The esp32 platform default carries this flag too.
        # -D${{ matrix.define }} selects the board profile (pins, display,
        # radio memory policy) independent of the sketch's
        # Arduino IDE default.
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32c5:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=enabled" \
            --build-property "compiler.c.elf.extra_flags=-Wl,-z,muldefs" \
            --build-property "compiler.cpp.extra_flags=-D${{ matrix.define }}" \
            --build-path "build-${{ matrix.variant }}" \
            AWOKxDAG/AWOKxDAG.ino

      - name: Stage ${{ matrix.label }} artifacts
        run: |
          mkdir -p release
          b="build-${{ matrix.variant }}"
          v="${{ matrix.variant }}"
          cp "$b/AWOKxDAG.ino.merged.bin"     "release/awokxdag-$v-merged.bin"
          cp "$b/AWOKxDAG.ino.bin"            "release/awokxdag-$v-app.bin"
          cp "$b/AWOKxDAG.ino.bootloader.bin" "release/awokxdag-$v-bootloader.bin"
          cp "$b/AWOKxDAG.ino.partitions.bin" "release/awokxdag-$v-partitions.bin"
          cp "$b/boot_app0.bin"               "release/awokxdag-$v-boot_app0.bin"
          ls -la release

      - name: Upload ${{ matrix.label }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.variant }}
          path: release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          ls -la

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: AWOKxDAG v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          body: |
            AWOKxDAG v${{ inputs.version }} — ESP32-C5 firmware.

            Two board profiles are built from the same source:

            - **Dual C5 Touch** — files prefixed `awokxdag-touch-…`
            - **Dual C5 Mini** (experimental) — files prefixed `awokxdag-mini-…`
              (dual-radio views use PSRAM-backed result tables and attempt
              Wi-Fi + BLE after a memory check; Wi-Fi-only fallback remains).

            **Easiest flash:** write the merged image for your board to `0x0`:
            ```
            esptool --chip esp32c5 write_flash 0x0 awokxdag-<board>-merged.bin
            ```
            Or use the individual images (`…-bootloader.bin` @ 0x2000,
            `…-partitions.bin` @ 0x8000, `…-boot_app0.bin` @ 0xe000,
            `…-app.bin` @ 0x10000). Verify with `SHA256SUMS`.
          files: release/*
